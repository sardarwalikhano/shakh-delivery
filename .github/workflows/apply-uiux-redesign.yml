name: Apply and verify UI redesign (temporary)

on:
  push:
    branches:
      - design/uiux-redesign-rollout-2026-10-17

permissions:
  contents: write

concurrency:
  group: uiux-redesign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Apply only the reviewed UI patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode patches/uiux-redesign.patch.gz.b64 | gzip --decompress | git apply --whitespace=nowarn
          git -c core.whitespace=cr-at-eol diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(cat <<'FILES' | sort
          src/components/AppShell.tsx
          src/features/auth/components/AuthCard.tsx
          src/features/checkout/CheckoutPage.tsx
          src/features/dashboard/DashboardLayout.tsx
          src/features/dashboard/DashboardPage.tsx
          src/features/delivery/pages/DeliveryPage.tsx
          src/features/marketplace/components/ProductCard.tsx
          src/features/marketplace/components/ProductGrid.tsx
          src/features/marketplace/pages/CartPage.tsx
          src/features/marketplace/pages/MarketplacePage.tsx
          src/features/marketplace/pages/ProductDetailPage.tsx
          src/features/marketplace/pages/WishlistPage.tsx
          src/features/notifications/pages/NotificationsPage.tsx
          src/features/orders/OrdersPage.tsx
          src/features/posts/pages/ApparelPostOrdersPage.tsx
          src/features/posts/pages/FoodPostCheckoutPage.tsx
          src/features/posts/pages/MyPostsPage.tsx
          src/features/posts/pages/PostDetailPage.tsx
          src/features/posts/pages/PostsPage.tsx
          src/features/posts/pages/ReferralWalletPage.tsx
          src/features/role-requests/pages/RoleRequestsPage.tsx
          src/routes/HomePage.tsx
          src/styles/globals.css
          FILES
          )"
          if [[ "$actual" != "$expected" ]]; then
            echo "Patch touched an unexpected set of paths."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

      - name: Configure non-secret build placeholders
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=https://placeholder.supabase.co" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder" >> "$GITHUB_ENV"
          echo "VITE_PUBLIC_APP_URL=https://daim-post.online" >> "$GITHUB_ENV"
          cp .env.example .env.local

      - name: Install pinned direct dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Validate build environment
        run: npm run check:env

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit verified UI changes to the feature branch
        shell: bash
        env:
          BRANCH_NAME: design/uiux-redesign-rollout-2026-10-17
        run: |
          set -euo pipefail
          rm -f .env.local
          git rm patches/uiux-redesign.patch.gz.b64 .github/workflows/apply-uiux-redesign.yml
          git add -u
          git -c core.whitespace=cr-at-eol diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Redesign core Shakh UI"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
