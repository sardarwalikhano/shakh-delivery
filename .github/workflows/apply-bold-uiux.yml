name: Apply and verify bold UI refresh

on:
  push:
    branches:
      - design/uiux-bold-refresh-2026-10-17

permissions:
  contents: write

concurrency:
  group: bold-ui-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main-based redesign branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Apply the reviewed seven-file visual patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode patches/uiux-bold-refresh.patch.gz.b64 | gzip --decompress | git apply --whitespace=nowarn
          git -c core.whitespace=cr-at-eol diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(cat <<'FILES' | sort
          src/components/AppShell.tsx
          src/features/auth/components/AuthCard.tsx
          src/features/dashboard/DashboardLayout.tsx
          src/features/marketplace/components/ProductCard.tsx
          src/features/marketplace/pages/MarketplacePage.tsx
          src/routes/HomePage.tsx
          src/styles/globals.css
          FILES
          )"
          if [[ "$actual" != "$expected" ]]; then
            echo "Patch touched an unexpected path set."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

      - name: Set safe non-secret build placeholders
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=https://placeholder.supabase.co" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder" >> "$GITHUB_ENV"
          echo "VITE_PUBLIC_APP_URL=https://www.daim-post.online" >> "$GITHUB_ENV"
          cp .env.example .env.local

      - name: Install project dependencies without upgrades
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Validate build environment
        run: npm run check:env

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Remove validation helpers and commit only the verified UI
        shell: bash
        env:
          BRANCH_NAME: design/uiux-bold-refresh-2026-10-17
        run: |
          set -euo pipefail
          rm -f .env.local
          git rm patches/uiux-bold-refresh.patch.gz.b64 .github/workflows/apply-bold-uiux.yml
          git add -u
          git -c core.whitespace=cr-at-eol diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make Shakh UI refresh visibly bold across all pages"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
